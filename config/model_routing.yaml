# Per-stage Hugging Face model routing.
#
# Edit this file to tune quality/cost without changing Python code.
# Stage-specific environment variables or --route CLI overrides can still
# override these values at runtime.
#
# Example CLI override:
#   --route editorial_review.model=openai/gpt-oss-120b:cheapest
#   --route editorial_review.provider=auto

topic_angle_selection:
  model: "openai/gpt-oss-20b:cheapest"
  provider: "auto"
  temperature: 0.2
  kind: "text"

research_synthesis:
  model: "deepseek-ai/DeepSeek-V4-Flash:cheapest"
  provider: "auto"
  temperature: 0.15
  kind: "text"

topic_brief:
  model: "openai/gpt-oss-120b:cheapest"
  provider: "auto"
  temperature: 0.35
  kind: "text"

article_generation:
  model: "openai/gpt-oss-120b:cheapest"
  provider: "auto"
  temperature: 0.55
  kind: "text"

editorial_review:
  model: "deepseek-ai/DeepSeek-V4-Flash:cheapest"
  provider: "auto"
  temperature: 0.1
  kind: "text"

revision:
  model: "openai/gpt-oss-120b:cheapest"
  provider: "auto"
  temperature: 0.45
  kind: "text"

final_polish:
  model: "openai/gpt-oss-20b:cheapest"
  provider: "auto"
  temperature: 0.2
  kind: "text"

featured_image:
  model: "black-forest-labs/FLUX.1-Krea-dev:cheapest"
  provider: "auto"
  kind: "image"
